site_name: timethis
site_description: Lightweight, header-only C++23 stopwatch utility with optional callbacks
site_author: Siddiq Software LLC
site_url: https://siddiqsoft.github.io/timethis/
repo_url: https://github.com/SiddiqSoft/TimeThis
repo_name: SiddiqSoft/TimeThis
edit_uri: edit/main/docs/

hooks:
  - docs/hooks.py

extra:
  version: "0.0.0-dev"

theme:
  name: material
  language: en
  logo: assets/Siddiq-Software-Avatar.png
  favicon: assets/Siddiq-Software-Avatar.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.tabs
    - toc.integrate
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - css/custom.css


nav:
  - Home: index.md
  - Quick Start:
      - Getting Started: quickstart/index.md
      - CMake & CPM: quickstart/cmake.md
      - Dependencies: quickstart/dependencies.md
      - NuGet Package: quickstart/nuget.md
  - API Reference:
      - Overview: api/index.md
  - Maintainer Guide:
      - CI/CD & Presets Architecture: maintainers/pipelines.md
  - License: license.md
